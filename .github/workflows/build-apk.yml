name: Build Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Telegram Standalone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build tools
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Show environment
        run: |
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Build obfuscated APK
        run: |
          ./gradlew \
            :TMessagesProj_AppStandalone:assembleAfatStandalone \
            --stacktrace \
            --no-daemon

      - name: Show build outputs
        if: always()
        run: |
          echo "===== APK ====="
          find TMessagesProj_AppStandalone/build/outputs \
            -type f -name "*.apk" -print || true

          echo "===== Mapping ====="
          find TMessagesProj_AppStandalone/build/outputs \
            -type f -name "mapping.txt" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Standalone-APK
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-R8-Mapping
          path: |
            TMessagesProj_AppStandalone/build/outputs/**/mapping.txt
          if-no-files-found: warn
          retention-days: 30
