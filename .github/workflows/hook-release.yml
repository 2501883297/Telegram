name: Build Telegram Release

on:
  # 手动运行
  workflow_dispatch:

  # 提交后自动运行
  push:
    branches:
      - master
      - hook-release

permissions:
  contents: read

concurrency:
  group: telegram-unobfuscated-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Unsigned Unobfuscated Release
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. Checkout 当前仓库
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      # ============================================================
      # 2. 获取 Telegram 官方最新 master
      #
      # 真正用于编译的是 DrKLO/Telegram 最新 master，
      # 不使用你 Fork 里可能落后的 Telegram 源码。
      # ============================================================
      - name: Fetch latest official Telegram
        shell: bash
        run: |
          set -euo pipefail

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/DrKLO/Telegram.git
          else
            git remote add upstream https://github.com/DrKLO/Telegram.git
          fi

          git fetch upstream master --tags

          git checkout --detach upstream/master

          echo "========================================"
          echo "Official Telegram commit:"
          git log -1 --oneline
          echo "========================================"

      # ============================================================
      # 3. 拉取 Telegram 子模块
      # ============================================================
      - name: Update submodules
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive \
            --depth=1

      # ============================================================
      # 4. 读取 Telegram 官方版本和包名
      # ============================================================
      - name: Read official version
        shell: bash
        run: |
          set -euo pipefail

          VERSION_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2- | tr -d '\r')
          VERSION_CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2- | tr -d '\r')
          APP_PACKAGE=$(grep '^APP_PACKAGE=' gradle.properties | cut -d= -f2- | tr -d '\r')

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: APP_VERSION_NAME not found"
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: APP_VERSION_CODE not found"
            exit 1
          fi

          if [ -z "$APP_PACKAGE" ]; then
            echo "ERROR: APP_PACKAGE not found"
            exit 1
          fi

          # afat 当前 abiVersionCode = 9
          FINAL_VERSION_CODE=$((VERSION_CODE * 10 + 9))

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "FINAL_VERSION_CODE=$FINAL_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_PACKAGE=$APP_PACKAGE" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Package            : $APP_PACKAGE"
          echo "Version Name       : $VERSION_NAME"
          echo "Base Version Code  : $VERSION_CODE"
          echo "Final Version Code : $FINAL_VERSION_CODE"
          echo "========================================"

      # ============================================================
      # 5. 临时修改 Release
      #
      # 保持：
      #   release
      #   debuggable false
      #   jniDebuggable false
      #   官方包名
      #   官方 Release Manifest
      #
      # 只改变：
      #   signingConfig   -> null
      #   minifyEnabled   -> false
      #   shrinkResources -> false
      #
      # 修改只存在于 Runner，不会提交。
      # ============================================================
      - name: Disable signing and obfuscation
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("TMessagesProj_App/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: TMessagesProj_App/build.gradle not found"
              )

          text = path.read_text(encoding="utf-8")


          def find_block(source, pattern, start=0):
              match = re.search(pattern, source[start:], re.MULTILINE)

              if not match:
                  raise RuntimeError(
                      f"Could not find Gradle block: {pattern}"
                  )

              block_start = start + match.start()

              opening = source.find("{", block_start)

              if opening == -1:
                  raise RuntimeError(
                      "Opening brace not found"
                  )

              depth = 0

              for i in range(opening, len(source)):
                  if source[i] == "{":
                      depth += 1

                  elif source[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return block_start, i + 1

              raise RuntimeError(
                  "Closing brace not found"
              )


          # 找 buildTypes {}
          bt_start, bt_end = find_block(
              text,
              r'^[ \t]*buildTypes[ \t]*\{'
          )

          build_types = text[bt_start:bt_end]

          # 只在 buildTypes 内找真正的 release {}
          rel_start, rel_end = find_block(
              build_types,
              r'^[ \t]*release[ \t]*\{'
          )

          release_block = build_types[
              rel_start:rel_end
          ]

          checks = {
              "debuggable false":
                  r'^[ \t]*debuggable[ \t]+false[ \t]*$',

              "jniDebuggable false":
                  r'^[ \t]*jniDebuggable[ \t]+false[ \t]*$',

              "release signing":
                  r'^[ \t]*signingConfig[ \t]+signingConfigs\.release[ \t]*$',

              "R8 enabled":
                  r'^[ \t]*minifyEnabled[ \t]+true[ \t]*$',

              "resource shrinking enabled":
                  r'^[ \t]*shrinkResources[ \t]+true[ \t]*$',
          }

          for name, pattern in checks.items():
              if not re.search(
                  pattern,
                  release_block,
                  re.MULTILINE
              ):
                  raise SystemExit(
                      f"ERROR: Expected Telegram Release setting "
                      f"not found: {name}. "
                      f"Upstream build.gradle may have changed."
                  )

          # 取消 Release 签名
          release_block, count = re.subn(
              r'^([ \t]*)signingConfig[ \t]+signingConfigs\.release[ \t]*$',
              r'\1signingConfig null',
              release_block,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Failed to disable signing"
              )

          # 关闭 R8 / ProGuard minification
          release_block, count = re.subn(
              r'^([ \t]*)minifyEnabled[ \t]+true[ \t]*$',
              r'\1minifyEnabled false',
              release_block,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Failed to disable minification"
              )

          # 关闭资源 shrink
          release_block, count = re.subn(
              r'^([ \t]*)shrinkResources[ \t]+true[ \t]*$',
              r'\1shrinkResources false',
              release_block,
              count=1,
              flags=re.MULTILINE
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Failed to disable resource shrinking"
              )

          new_build_types = (
              build_types[:rel_start]
              + release_block
              + build_types[rel_end:]
          )

          new_text = (
              text[:bt_start]
              + new_build_types
              + text[bt_end:]
          )

          path.write_text(
              new_text,
              encoding="utf-8"
          )

          print("========================================")
          print("Release configuration patched:")
          print("")
          print("debuggable      = false")
          print("jniDebuggable   = false")
          print("signingConfig   = null")
          print("minifyEnabled   = false")
          print("shrinkResources = false")
          print("========================================")
          PY

      # ============================================================
      # 6. 打印实际修改
      # ============================================================
      - name: Show Release changes
        shell: bash
        run: |
          set -euo pipefail

          git diff -- TMessagesProj_App/build.gradle

      # ============================================================
      # 7. Java
      #
      # setup-java v6 使用新版运行时
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 8. Android SDK
      #
      # setup-android v4 已迁移到 Node 24，
      # 同时解决之前旧 SDK tools 包的问题。
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      # ============================================================
      # 9. 安装 Telegram 当前需要的组件
      # ============================================================
      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # ============================================================
      # 10. 环境检查
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          echo "========== Java =========="
          java -version

          echo "========== Gradle =========="
          ./gradlew --version

          echo "========== SDK Manager =========="
          sdkmanager --version

      # ============================================================
      # 11. 只编译：
      #
      # TMessagesProj_App
      # afat
      # Release
      #
      # 最终只要这个 APK。
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 12. 找到唯一 APK
      # ============================================================
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          OUTPUT_DIR="TMessagesProj_App/build/outputs/apk/afat/release"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "ERROR: Expected APK directory does not exist:"
            echo "$OUTPUT_DIR"

            echo ""
            echo "Other APK files:"
            find TMessagesProj_App/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          mapfile -t APKS < <(
            find "$OUTPUT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk"
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one Release APK."
            echo "Found: ${#APKS[@]}"

            printf '%s\n' "${APKS[@]}"

            exit 1
          fi

          APK_FILE="${APKS[0]}"

          OUTPUT_NAME="Telegram-${VERSION_NAME}-${FINAL_VERSION_CODE}-Release-Unsigned-NoObfuscation.apk"

          cp \
            "$APK_FILE" \
            "dist/$OUTPUT_NAME"

          echo "APK_PATH=dist/$OUTPUT_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUTPUT_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "APK:"
          ls -lh "dist/$OUTPUT_NAME"
          echo "========================================"

      # ============================================================
      # 13. 验证包名和版本
      # ============================================================
      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          BADGING=$(
            "$AAPT" dump badging "$APK_PATH" \
            | head -n 1
          )

          echo "$BADGING"

          echo "$BADGING" \
            | grep -F "name='${APP_PACKAGE}'" \
            >/dev/null

          echo "$BADGING" \
            | grep -F "versionName='${VERSION_NAME}'" \
            >/dev/null

          echo "$BADGING" \
            | grep -F "versionCode='${FINAL_VERSION_CODE}'" \
            >/dev/null

          echo "========================================"
          echo "Package/version: OK"
          echo "========================================"

      # ============================================================
      # 14. 验证 APK 确实未签名
      # ============================================================
      - name: Verify APK is unsigned
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if "$APKSIGNER" verify "$APK_PATH" >/dev/null 2>&1; then
            echo "ERROR: APK has a valid signature."
            exit 1
          fi

          echo "========================================"
          echo "APK signing: UNSIGNED"
          echo "========================================"

      # ============================================================
      # 15. 验证没有执行 R8 混淆
      # ============================================================
      - name: Verify no R8 obfuscation
        shell: bash
        run: |
          set -euo pipefail

          MAPPING=$(
            find TMessagesProj_App/build/outputs \
              -type f \
              -name "mapping.txt" \
              2>/dev/null || true
          )

          if [ -n "$MAPPING" ]; then
            echo "ERROR: R8 mapping.txt exists:"
            echo "$MAPPING"
            exit 1
          fi

          echo "========================================"
          echo "R8 / ProGuard minification: DISABLED"
          echo "Resource shrinking: DISABLED"
          echo "========================================"

      # ============================================================
      # 16. 输出摘要
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo "=============================================="
          echo "Telegram APK build completed"
          echo ""
          echo "Package            : $APP_PACKAGE"
          echo "Version Name       : $VERSION_NAME"
          echo "Base Version Code  : $VERSION_CODE"
          echo "Final Version Code : $FINAL_VERSION_CODE"
          echo ""
          echo "Build Type         : Release"
          echo "Debuggable         : false"
          echo "R8 / ProGuard      : disabled"
          echo "Resource Shrink    : disabled"
          echo "Signing            : unsigned"
          echo ""
          echo "APK:"
          echo "$APK_NAME"
          echo "=============================================="

      # ============================================================
      # 17. 上传唯一 APK
      #
      # upload-artifact v7 支持直接上传单文件，
      # archive:false 后下载到的就是 APK，不需要解 ZIP。
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 14
