name: Build Telegram Unobfuscated Release

on:
  # 手动运行
  workflow_dispatch:

  # 提交后自动运行
  push:
    branches:
      - master
      - hook-release

permissions:
  contents: read

concurrency:
  group: telegram-unobfuscated-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Unsigned Unobfuscated Release
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout 当前仓库
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ============================================================
      # 2. 获取 Telegram 官方最新 master
      #
      # 无论你从 master 还是 hook-release 触发，
      # 真正用于编译的源码都是官方最新 master。
      # ============================================================
      - name: Fetch latest official Telegram source
        shell: bash
        run: |
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/DrKLO/Telegram.git
          else
            git remote add upstream https://github.com/DrKLO/Telegram.git
          fi

          git fetch upstream master

          # 直接切到官方最新源码
          git checkout --detach upstream/master

          echo "========================================"
          echo "Official Telegram commit:"
          git log -1 --oneline
          echo "========================================"

      # ============================================================
      # 3. 拉取官方指定的子模块版本
      # ============================================================
      - name: Update submodules
        shell: bash
        run: |
          git submodule sync --recursive

          git submodule update \
            --init \
            --recursive \
            --depth=1

      # ============================================================
      # 4. 读取官方版本号、包名
      #
      # 不手写版本号。
      # 每一次构建都读取官方最新 gradle.properties。
      # ============================================================
      - name: Read official version
        shell: bash
        run: |
          VERSION_NAME=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2- | tr -d '\r')
          VERSION_CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2- | tr -d '\r')
          APP_PACKAGE=$(grep '^APP_PACKAGE=' gradle.properties | cut -d= -f2- | tr -d '\r')

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: APP_VERSION_NAME not found"
            exit 1
          fi

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: APP_VERSION_CODE not found"
            exit 1
          fi

          if [ -z "$APP_PACKAGE" ]; then
            echo "ERROR: APP_PACKAGE not found"
            exit 1
          fi

          # afat flavor 当前 abiVersionCode = 9
          FINAL_VERSION_CODE=$((VERSION_CODE * 10 + 9))

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "FINAL_VERSION_CODE=$FINAL_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_PACKAGE=$APP_PACKAGE" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Package           : $APP_PACKAGE"
          echo "Version Name      : $VERSION_NAME"
          echo "Base Version Code : $VERSION_CODE"
          echo "Final Version Code: $FINAL_VERSION_CODE"
          echo "========================================"

      # ============================================================
      # 5. 临时修改官方 Release 构建
      #
      # 保留：
      #   Release
      #   debuggable false
      #   jniDebuggable false
      #   官方 package
      #   官方 Release Manifest
      #
      # 只关闭：
      #   signing
      #   R8 / ProGuard minify
      #   resource shrinking
      #
      # 这些修改只存在于 GitHub Runner，
      # 不会提交回仓库。
      # ============================================================
      - name: Disable signing and obfuscation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("TMessagesProj_App/build.gradle")

          if not path.exists():
              raise SystemExit(
                  "ERROR: TMessagesProj_App/build.gradle not found"
              )

          text = path.read_text(encoding="utf-8")


          def block_end(source, opening_brace):
              depth = 0

              for i in range(opening_brace, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1

                      if depth == 0:
                          return i + 1

              raise RuntimeError("Unclosed Gradle block")


          # --------------------------------------------------------
          # 找 buildTypes {
          # --------------------------------------------------------
          build_match = re.search(
              r'(?m)^[ \t]*buildTypes[ \t]*\{',
              text
          )

          if not build_match:
              raise SystemExit(
                  "ERROR: buildTypes block not found. "
                  "Telegram build.gradle structure may have changed."
              )

          build_open = text.find(
              "{",
              build_match.start()
          )

          build_end = block_end(
              text,
              build_open
          )

          build_types = text[
              build_match.start():build_end
          ]


          # --------------------------------------------------------
          # 只找真正的：
          #
          # release {
          #
          # 不会误匹配 signingConfigs.release
          # --------------------------------------------------------
          release_match = re.search(
              r'(?m)^[ \t]*release[ \t]*\{',
              build_types
          )

          if not release_match:
              raise SystemExit(
                  "ERROR: release buildType not found. "
                  "Telegram build.gradle structure may have changed."
              )

          release_open = build_types.find(
              "{",
              release_match.start()
          )

          release_end = block_end(
              build_types,
              release_open
          )

          release_block = build_types[
              release_match.start():release_end
          ]


          # --------------------------------------------------------
          # 确保我们现在处理的是预期的 Telegram Release
          # --------------------------------------------------------
          required_patterns = [
              r'(?m)^[ \t]*debuggable[ \t]+false[ \t]*$',
              r'(?m)^[ \t]*jniDebuggable[ \t]+false[ \t]*$',
              r'(?m)^[ \t]*signingConfig[ \t]+signingConfigs\.release[ \t]*$',
              r'(?m)^[ \t]*minifyEnabled[ \t]+true[ \t]*$',
              r'(?m)^[ \t]*shrinkResources[ \t]+true[ \t]*$',
          ]

          for pattern in required_patterns:
              if not re.search(pattern, release_block):
                  raise SystemExit(
                      "ERROR: Official Telegram Release configuration "
                      "has changed. Refusing to patch blindly."
                  )


          # --------------------------------------------------------
          # Release 签名 -> 未签名
          # --------------------------------------------------------
          release_block, count_signing = re.subn(
              r'(?m)^([ \t]*)signingConfig[ \t]+signingConfigs\.release[ \t]*$',
              r'\1signingConfig null',
              release_block,
              count=1
          )


          # --------------------------------------------------------
          # R8 / ProGuard -> 关闭
          # --------------------------------------------------------
          release_block, count_minify = re.subn(
              r'(?m)^([ \t]*)minifyEnabled[ \t]+true[ \t]*$',
              r'\1minifyEnabled false',
              release_block,
              count=1
          )


          # --------------------------------------------------------
          # Resource shrinking -> 关闭
          # --------------------------------------------------------
          release_block, count_shrink = re.subn(
              r'(?m)^([ \t]*)shrinkResources[ \t]+true[ \t]*$',
              r'\1shrinkResources false',
              release_block,
              count=1
          )


          if (
              count_signing != 1
              or count_minify != 1
              or count_shrink != 1
          ):
              raise SystemExit(
                  "ERROR: Failed to safely patch Release configuration."
              )


          new_build_types = (
              build_types[:release_match.start()]
              + release_block
              + build_types[release_end:]
          )

          new_text = (
              text[:build_match.start()]
              + new_build_types
              + text[build_end:]
          )

          path.write_text(
              new_text,
              encoding="utf-8"
          )


          print("========================================")
          print("Release configuration patched")
          print("")
          print("debuggable      = false")
          print("jniDebuggable   = false")
          print("signingConfig   = null")
          print("minifyEnabled   = false")
          print("shrinkResources = false")
          print("========================================")
          PY

      # ============================================================
      # 6. 把实际修改打印出来
      #
      # 如果以后 Telegram 改结构，可以直接从日志看。
      # ============================================================
      - name: Show Release configuration changes
        shell: bash
        run: |
          echo "========================================"
          git diff -- TMessagesProj_App/build.gradle
          echo "========================================"

      # ============================================================
      # 7. Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # 8. Android SDK
      #
      # 用 v4，避免之前 v3 的：
      #
      # Failed to find package 'tools'
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ============================================================
      # 9. 安装 Telegram 官方当前构建环境
      # ============================================================
      - name: Install Android components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # ============================================================
      # 10. Gradle
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          chmod +x ./gradlew

          echo "========== Java =========="
          java -version

          echo "========== Gradle =========="
          ./gradlew --version

          echo "========== SDK Manager =========="
          sdkmanager --version

      # ============================================================
      # 11. 只编译一个 APK
      #
      # TMessagesProj_App
      # +
      # afat
      # +
      # Release
      #
      # 不编译 Debug
      # 不编译 Standalone
      # 不生成 AAB
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          ./gradlew \
            :TMessagesProj_App:assembleAfatRelease \
            --no-daemon \
            --stacktrace

      # ============================================================
      # 12. 找到唯一的 Release APK
      # ============================================================
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist

          OUTPUT_DIR="TMessagesProj_App/build/outputs/apk/afat/release"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "ERROR: APK output directory not found"

            find TMessagesProj_App/build/outputs \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          mapfile -t APKS < <(
            find "$OUTPUT_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.apk"
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 APK."
            echo "Found: ${#APKS[@]}"

            printf '%s\n' "${APKS[@]}"

            exit 1
          fi

          APK_FILE="${APKS[0]}"

          OUTPUT_NAME="Telegram-${VERSION_NAME}-${FINAL_VERSION_CODE}-Release-Unsigned-NoObfuscation.apk"

          cp \
            "$APK_FILE" \
            "dist/$OUTPUT_NAME"

          echo "APK_PATH=dist/$OUTPUT_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUTPUT_NAME" >> "$GITHUB_ENV"

          echo "========================================"
          echo "APK generated:"
          ls -lh "dist/$OUTPUT_NAME"
          echo "========================================"

      # ============================================================
      # 13. 验证：
      #
      # 包名没有改变
      # versionName 正确
      # versionCode 正确
      # ============================================================
      - name: Verify package and version
        shell: bash
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          BADGING=$(
            "$AAPT" dump badging "$APK_PATH" \
            | head -n 1
          )

          echo "$BADGING"

          echo "$BADGING" \
            | grep "name='${APP_PACKAGE}'" \
            >/dev/null

          echo "$BADGING" \
            | grep "versionName='${VERSION_NAME}'" \
            >/dev/null

          echo "$BADGING" \
            | grep "versionCode='${FINAL_VERSION_CODE}'" \
            >/dev/null

          echo "========================================"
          echo "Package/version verification: OK"
          echo "========================================"

      # ============================================================
      # 14. 验证 APK 未签名
      # ============================================================
      - name: Verify APK is unsigned
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          if "$APKSIGNER" verify "$APK_PATH" >/dev/null 2>&1; then
            echo "ERROR: APK contains a valid signature."
            exit 1
          fi

          echo "========================================"
          echo "Unsigned APK verification: OK"
          echo "========================================"

      # ============================================================
      # 15. 验证 R8 没有运行
      # ============================================================
      - name: Verify no R8 obfuscation
        shell: bash
        run: |
          MAPPING=$(
            find \
              TMessagesProj_App/build/outputs \
              -type f \
              -name "mapping.txt" \
              2>/dev/null || true
          )

          if [ -n "$MAPPING" ]; then
            echo "ERROR: mapping.txt exists:"
            echo "$MAPPING"
            exit 1
          fi

          echo "========================================"
          echo "R8 / ProGuard minification: DISABLED"
          echo "Resource shrinking: DISABLED"
          echo "========================================"

      # ============================================================
      # 16. 最终信息
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo "=============================================="
          echo "Telegram Release APK completed"
          echo ""
          echo "Package           : $APP_PACKAGE"
          echo "Version Name      : $VERSION_NAME"
          echo "Base Version Code : $VERSION_CODE"
          echo "Final Version Code: $FINAL_VERSION_CODE"
          echo ""
          echo "Build Type        : Release"
          echo "Debuggable        : false"
          echo "R8 / ProGuard     : disabled"
          echo "Resource Shrink   : disabled"
          echo "Signing           : unsigned"
          echo ""
          echo "APK:"
          echo "$APK_NAME"
          echo "=============================================="

      # ============================================================
      # 17. 只上传这一个 APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-${{ env.VERSION_NAME }}-Release-Unsigned-NoObfuscation
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
